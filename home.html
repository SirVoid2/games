<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Koda</title>
<link rel="icon" type="image/png" href="images/logo.png" />
<link rel="stylesheet" href="main.css" />

<style>
/* Overlay styles */
#iframeOverlay {
  display: none; /* Hidden by default */
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.8);
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

#iframeContainer {
  position: relative;
  width: 80%;
  height: 80%;
  background: #fff;
  padding: 10px;
  box-sizing: border-box;
}

#iframeContainer iframe {
  width: 100%;
  height: 100%;
  border: none;
}

#closeOverlay {
  position: absolute;
  top: 5px;
  right: 10px;
  background: #333;
  color: #fff;
  border: none;
  padding: 5px 10px;
  cursor: pointer;
  font-size: 16px;
  z-index: 10000;
}
</style>
</head>
<body>

<!-- Your existing content -->

<h2>Games!</h2>
<div class="carousel-container">
  <button class="scroll-btn left" onclick="scrollLeft(this.parentElement)">&#10094;</button>
  <div class="carousel">
    <br>
    <a href="#" class="g-item" onclick="openIframeOverlay('src/g/Retro Bowl/')">
      <img src="src/g/Retro Bowl/retro-bowl.jpg" alt="Retro Bowl" />
    </a>
    <a href="#" class="g-item" onclick="openIframeOverlay('src/g/Retro Bowl College/')">
      <img src="src/g/Retro Bowl College/retro-bowl-college.png" alt="Retro Bowl College" />
    </a>
    <a href="#" class="g-item" onclick="openIframeOverlay('src/g/Ant Art Tycoon/')">
      <img src="src/g/Ant Art Tycoon/ant-art-tycoon.png" alt="Ant Art Tycoon" />
    </a>
    <a href="#" class="g-item" onclick="openIframeOverlay('src/g/Drive Mad/')">
      <img src="src/games/Drive Mad/drive-mad.jpg" alt="Drive Mad" />
    </a>
    <a href="#" class="g-item" onclick="openIframeOverlay('src/g/1v1LoL/')">
      <img src="src/g/1v1LoL/1v1lol.jpeg" alt="1v1LoL" />
    </a>
    <a href="#" class="g-item" onclick="openIframeOverlay('src/g/Minecraft/')">
      <img src="src/g/Minecraft/mc.png" alt="Minecraft" />
    </a>
    <a href="#" class="g-item" onclick="openIframeOverlay('src/g/Crossy Road/')">
      <img src="src/g/Crossy Road/crossy-road.webp" alt="Crossy Road" />
    </a>
    <a href="#" class="g-item" onclick="openIframeOverlay('src/g/Bloxorz/')">
      <img src="src/g/Bloxorz/bloxorz.jpg" alt="Bloxorz" />
    </a>
    <a href="#" class="g-item" onclick="openIframeOverlay('src/g/Fruit Ninja/')">
      <img src="src/g/Fruit Ninja/fruit-ninja.png" alt="Fruit Ninja" />
    </a>
  </div>
  <button class="scroll-btn right" onclick="scrollRight(this.parentElement)">&#10095;</button>
</div>

<h2>Movies</h2>
<div class="carousel-container">
  <button class="scroll-btn left" onclick="scrollLeft(this.parentElement)">&#10094;</button>
  <div class="carousel">
    <br>
    <a href="#" class="m-item" onclick="openIframeOverlay('src/m/Superman/')">
      <img src="src/m/Superman/superman.webp" alt="Superman" />
    </a>
    <a href="#" class="m-item" onclick="openIframeOverlay('src/m/Hunger Games/')">
      <img src="src/m/Hunger Games/hunger-games.webp" alt="Hunger Games" />
    </a>
  </div>
  <button class="scroll-btn right" onclick="scrollRight(this.parentElement)">&#10095;</button>
</div>

<!-- Overlay for iframe -->
<div id="iframeOverlay">
  <div id="iframeContainer">
    <button id="closeOverlay" onclick="closeIframeOverlay()">X</button>
    <iframe src="" id="iframeContent"></iframe>
  </div>
</div>

<script>
function scrollLeft(container) {
  const carousel = container.querySelector('.carousel');
  carousel.scrollBy({ left: -carousel.clientWidth * 0.7, behavior: 'smooth' });
}

function scrollRight(container) {
  const carousel = container.querySelector('.carousel');
  carousel.scrollBy({ left: carousel.clientWidth * 0.7, behavior: 'smooth' });
}

function openIframeOverlay(url) {
  const overlay = document.getElementById('iframeOverlay');
  const iframe = document.getElementById('iframeContent');
  iframe.src = url;
  overlay.style.display = 'flex';
}

function closeIframeOverlay() {
  const overlay = document.getElementById('iframeOverlay');
  const iframe = document.getElementById('iframeContent');
  iframe.src = '';
  overlay.style.display = 'none';
}
</script>

</body>
</html>
