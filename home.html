<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Media Gallery</title>
<style>
/* Overlay styles */
#iframeOverlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-color: rgba(0, 0, 0, 0.8);
  justify-content: center; align-items: center;
  z-index: 9999;
  flex-direction: column;
}
#iframeContainer {
  position: relative;
  width: 80%; height: 80%;
  background: #fff;
  display: flex; flex-direction: column;
  padding: 10px;
  box-sizing: border-box;
}
#iframeContainer iframe {
  flex: 1;
  width: 100%; height: 100%;
  border: none;
}
#topButtons {
  display: flex; justify-content: flex-end; margin-bottom: 5px;
}
#closeOverlay, #fullscreenBtn {
  background: #333; color: #fff; border: none; padding: 5px 10px; margin-left: 5px; cursor: pointer; font-size: 14px;
}
#closeOverlay:hover, #fullscreenBtn:hover {
  background: #555;
}
/* Carousel styles */
#media-sections {
  margin-top: 20px;
}
.row {
  margin-bottom: 30px;
}
.carousel-container {
  display: flex; align-items: center; position: relative; margin: 10px 0;
}
.carousel {
  display: flex; overflow-x: auto; scroll-behavior: smooth; padding: 10px;
}
.media-item {
  flex: 0 0 auto; margin-right: 10px; cursor: pointer;
}
.media-item img {
  width: 150px; height: 100px; object-fit: cover;
}
.scroll-btn {
  background: none; border: none; font-size: 24px; cursor: pointer; padding: 10px;
}
</style>
</head>
<body>

<h2>Movies</h2>
<div id="movies-section" class="carousel-container">
  <button class="scroll-btn left" onclick="scrollLeft(this.parentElement)">&#10094;</button>
  <div class="carousel" id="movies-carousel"></div>
  <button class="scroll-btn right" onclick="scrollRight(this.parentElement)">&#10095;</button>
</div>

<h2>Games</h2>
<div id="game-sections"></div>

<!-- Overlay for iframe -->
<div id="iframeOverlay">
  <div id="iframeContainer">
    <div id="topButtons">
      <button id="closeOverlay" onclick="closeIframeOverlay()">×</button>
      <button id="fullscreenBtn" onclick="toggleFullscreen()">Fullscreen</button>
    </div>
    <iframe src="" id="iframeContent"></iframe>
  </div>
</div>

<script>
// Functions for carousel scrolling
function scrollLeft(container) {
  const carousel = container.querySelector('.carousel');
  carousel.scrollBy({ left: -carousel.clientWidth * 0.7, behavior: 'smooth' });
}
function scrollRight(container) {
  const carousel = container.querySelector('.carousel');
  carousel.scrollBy({ left: carousel.clientWidth * 0.7, behavior: 'smooth' });
}

// Overlay logic
const iframeOverlay = document.getElementById('iframeOverlay');
const iframeContent = document.getElementById('iframeContent');
let isFullscreen = false;

function openMediaIframe(url) {
  iframeContent.src = url;
  iframeOverlay.style.display = 'flex';
  isFullscreen = false;
}
function closeIframeOverlay() {
  iframeContent.src = '';
  iframeOverlay.style.display = 'none';
}
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    iframeContent.requestFullscreen();
    isFullscreen = true;
  } else {
    document.exitFullscreen();
    isFullscreen = false;
  }
}

// Load movies from movies.json
fetch('movies.json')
  .then(res => res.json())
  .then(movies => {
    const container = document.getElementById('movies-carousel');
    movies.forEach(movie => {
      const item = document.createElement('div');
      item.className = 'media-item';
      item.innerHTML = `<img src="${movie.cover}" alt="${movie.title}"><p>${movie.title}</p>`;
      item.onclick = () => openMediaIframe(movie.video);
      container.appendChild(item);
    });
  })
  .catch(err => console.error('Failed to load movies.json:', err));

// Load games from game.json
fetch('games.json')
  .then(res => res.json())
  .then(games => {
    const container = document.getElementById('game-sections');

    const sectionDiv = document.createElement('div');
    sectionDiv.className = 'row';

    const h2 = document.createElement('h2');
    h2.textContent = "My Games";
    sectionDiv.appendChild(h2);

    const carouselContainer = document.createElement('div');
    carouselContainer.className = 'carousel-container';

    const leftBtn = document.createElement('button');
    leftBtn.className = 'scroll-btn left';
    leftBtn.innerHTML = '&#10094;';
    leftBtn.onclick = () => {
      const carousel = carouselContainer.querySelector('.carousel');
      carousel.scrollBy({ left: -carousel.clientWidth * 0.7, behavior: 'smooth' });
    };
    carouselContainer.appendChild(leftBtn);

    const carousel = document.createElement('div');
    carousel.className = 'carousel';

    games.forEach(game => {
      const item = document.createElement('div');
      item.className = 'media-item';
      item.innerHTML = `<img src="${game.cover}" alt="${game.title}"><p>${game.title}</p>`;
      item.onclick = () => openMediaIframe(game.url);
      carousel.appendChild(item);
    });

    carouselContainer.appendChild(carousel);

    const rightBtn = document.createElement('button');
    rightBtn.className = 'scroll-btn right';
    rightBtn.innerHTML = '&#10095;';
    rightBtn.onclick = () => {
      const carousel = carouselContainer.querySelector('.carousel');
      carousel.scrollBy({ left: carousel.clientWidth * 0.7, behavior: 'smooth' });
    };
    carouselContainer.appendChild(rightBtn);

    sectionDiv.appendChild(carouselContainer);
    container.appendChild(sectionDiv);
  })
  .catch(err => console.error('Failed to load game.json:', err));
</script>

</body>
</html>
