<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koda</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="stylesheet" href="main.css">
</head>
<body>

  <h2>Games</h2>
  <div class="carousel-container">
    <button class="scroll-btn left" onclick="scrollLeft(this.parentElement)">&#10094;</button>
    <div class="carousel">
      <a href="src/Retro Bowl/" class="game-item">
        <img src="src/Retro Bowl/retro-bowl.jpg" alt="Retro Bowl">
      </a>
      <a href="src/Retro Bowl College/" class="game-item">
        <img src="src/Retro Bowl College/retro-bowl-college.png" alt="Retro Bowl College">
      </a>
      <a href="src/Ant Art Tycoon/" class="game-item">
        <img src="src/Ant Art Tycoon/ant-art-tycoon.png" alt="Ant Art Tycoon">
      </a>
      <a href="src/Drive Mad/" class="game-item">
        <img src="src/Drive Mad/drive-mad.jpg" alt="Drive Mad">
      </a>
      <a href="src/1v1LoL/" class="game-item">
        <img src="src/1v1LoL/1v1lol.jpeg" alt="1v1LoL">
      </a>
      <a href="src/Minecraft/" class="game-item">
        <img src="src/Minecraft/mc.png" alt="Minecraft">
      </a>
      <a href="src/Crossy Road/" class="game-item">
        <img src="src/Crossy Road/crossy-road.webp" alt="Crossy Road">
      </a>
      <a href="src/Bloxorz/" class="game-item">
        <img src="src/Bloxorz/bloxorz.jpg" alt="Bloxorz">
      </a>
      <a href="src/Fruit Ninja/" class="game-item">
        <img src="src/Fruit Ninja/fruit-ninja.png" alt="Fruit Ninja">
      </a>
    </div>
    <button class="scroll-btn right" onclick="scrollRight(this.parentElement)">&#10095;</button>
  </div>

  <h2>Apps</h2>
  <div class="carousel-container">
    <button class="scroll-btn left" onclick="scrollLeft(this.parentElement)">&#10094;</button>
    <div class="carousel">
      <a href="src/Jellyfin/" class="game-item">
        <img src="images/logo.png" alt="Jellyfin">
      </a>
    </div>
    <button class="scroll-btn right" onclick="scrollRight(this.parentElement)">&#10095;</button>
  </div>

<script>
function scrollLeft(container) {
  const carousel = container.querySelector('.carousel');
  carousel.scrollBy({ left: -carousel.clientWidth * 0.7, behavior: 'smooth' });
}

function scrollRight(container) {
  const carousel = container.querySelector('.carousel');
  carousel.scrollBy({ left: carousel.clientWidth * 0.7, behavior: 'smooth' });
}
</script>

</body>
</html>
