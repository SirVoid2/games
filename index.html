<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Koda</title>
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>

<h2>Games!</h2>
<div class="carousel-container">
  <button class="scroll-btn left" onclick="scrollLeft(this.parentElement)">&#10094;</button>
  <div class="carousel" id="games-carousel"></div>
  <button class="scroll-btn right" onclick="scrollRight(this.parentElement)">&#10095;</button>
</div>

<!-- Overlay for iframe -->
<div id="iframeOverlay">
  <div id="iframeContainer">
    <div id="topButtons">
      <button id="closeOverlay" onclick="closeIframeOverlay()">X</button>
      <button id="fullscreenBtn" onclick="toggleFullscreen()">Fullscreen</button>
    </div>
    <iframe src="" id="iframeContent"></iframe>
  </div>
</div>

<script>
// Data arrays
const gGames = [
  { title: "Retro Bowl", cover: "src/g/Retro Bowl/retro-bowl.jpg", url: "src/g/Retro Bowl/" },
  { title: "Retro Bowl College", cover: "src/g/Retro Bowl College/retro-bowl-college.png", url: "src/g/Retro Bowl College/" },
  { title: "Ant Art Tycoon", cover: "src/g/Ant Art Tycoon/ant-art-tycoon.png", url: "src/g/Ant Art Tycoon/" },
  { title: "Drive Mad", cover: "src/g/Drive Mad/drive-mad.jpg", url: "src/g/Drive Mad/" },
  { title: "1v1LoL", cover: "src/g/1v1LoL/1v1lol.jpeg", url: "src/g/1v1LoL/" },
  { title: "BlackJack", cover: "src/g/1v1LoL/1v1lol.jpeg", url: "https://qasblackjack.vercel.app" },
  { title: "Minecraft", cover: "src/g/Minecraft/mc.png", url: "src/g/Minecraft/" },
  { title: "Crossy Road", cover: "src/g/Crossy Road/crossy-road.webp", url: "src/g/Crossy Road/" },
  { title: "Bloxorz", cover: "src/g/Bloxorz/bloxorz.jpg", url: "src/g/Bloxorz/" },
  { title: "Fruit Ninja", cover: "src/g/Fruit Ninja/fruit-ninja.png", url: "src/g/Fruit Ninja/" }
];

// Function to create sections
function createSection(title, items, isGame = false) {
  const container = document.createElement('div');
  container.className = 'row';

  const h2 = document.createElement('h2');
  h2.textContent = title;
  container.appendChild(h2);

  const carouselContainer = document.createElement('div');
  carouselContainer.className = 'carousel-container';

  const leftBtn = document.createElement('button');
  leftBtn.className = 'scroll-btn left';
  leftBtn.innerHTML = '&#10094;';
  leftBtn.onclick = () => {
    const carousel = carouselContainer.querySelector('.carousel');
    carousel.scrollBy({ left: -carousel.clientWidth * 0.7, behavior: 'smooth' });
  };

  const carousel = document.createElement('div');
  carousel.className = 'carousel';

  items.forEach(item => {
    const div = document.createElement('div');
    div.className = isGame ? 'g-item' : 'm-item';
    div.innerHTML = `<img src="${item.cover}" alt="${item.title}"><p>${item.title}</p>`;
    div.onclick = () => openIframeOverlay(item.url);
    carousel.appendChild(div);
  });

  const rightBtn = document.createElement('button');
  rightBtn.className = 'scroll-btn right';
  rightBtn.innerHTML = '&#10095;';
  rightBtn.onclick = () => {
    const carousel = carouselContainer.querySelector('.carousel');
    carousel.scrollBy({ left: carousel.clientWidth * 0.7, behavior: 'smooth' });
  };

  carouselContainer.appendChild(leftBtn);
  carouselContainer.appendChild(carousel);
  carouselContainer.appendChild(rightBtn);
  container.appendChild(carouselContainer);
  document.body.appendChild(container);
}

// Create sections for games
createSection("My Games", gGames, true);

// Scroll functions
function scrollLeft(container) {
  const carousel = container.querySelector('.carousel');
  carousel.scrollBy({ left: -carousel.clientWidth * 0.7, behavior: 'smooth' });
}
function scrollRight(container) {
  const carousel = container.querySelector('.carousel');
  carousel.scrollBy({ left: carousel.clientWidth * 0.7, behavior: 'smooth' });
}

const overlay = document.getElementById('iframeOverlay');
const iframe = document.getElementById('iframeContent');

let isFullscreen = false;

function openIframeOverlay(url) {
  iframe.src = url;
  overlay.style.display = 'flex';
  isFullscreen = false;
}

function closeIframeOverlay() {
  iframe.src = '';
  overlay.style.display = 'none';
}

function toggleFullscreen() {
  const overlayEl = document.getElementById('iframeOverlay');
  if (!isFullscreen) {
    if (overlayEl.requestFullscreen) {
      overlayEl.requestFullscreen();
    } else if (overlayEl.webkitRequestFullscreen) {
      overlayEl.webkitRequestFullscreen();
    } else if (overlayEl.msRequestFullscreen) {
      overlayEl.msRequestFullscreen();
    }
    isFullscreen = true;
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    } else if (document.msExitFullscreen) {
      document.msExitFullscreen();
    }
    isFullscreen = false;
  }
}
</script>

</body>
</html>
