<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koda</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="stylesheet" href="main.css">
</head>
<body>

  <h2>Games</h2>
  <div class="carousel-container">
    <button class="scroll-btn left" onclick="scrollLeft(this.parentElement)">&#10094;</button>
    <div class="carousel">
      <br>
      <a href="src/games/Retro Bowl/" class="game-item">
        <img src="src/games/Retro Bowl/retro-bowl.jpg" alt="Retro Bowl">
      </a>
      <a href="src/gamess/Retro Bowl College/" class="game-item">
        <img src="src/games/Retro Bowl College/retro-bowl-college.png" alt="Retro Bowl College">
      </a>
      <a href="src/games/Ant Art Tycoon/" class="game-item">
        <img src="src/games/Ant Art Tycoon/ant-art-tycoon.png" alt="Ant Art Tycoon">
      </a>
      <a href="src/games/Drive Mad/" class="game-item">
        <img src="src/games/Drive Mad/drive-mad.jpg" alt="Drive Mad">
      </a>
      <a href="src/games/1v1LoL/" class="game-item">
        <img src="src/games/1v1LoL/1v1lol.jpeg" alt="1v1LoL">
      </a>
      <a href="src/games/Minecraft/" class="game-item">
        <img src="src/games/Minecraft/mc.png" alt="Minecraft">
      </a>
      <a href="src/games/Crossy Road/" class="game-item">
        <img src="src/games/Crossy Road/crossy-road.webp" alt="Crossy Road">
      </a>
      <a href="src/games/Bloxorz/" class="game-item">
        <img src="src/games/Bloxorz/bloxorz.jpg" alt="Bloxorz">
      </a>
      <a href="src/games/Fruit Ninja/" class="game-item">
        <img src="src/games/Fruit Ninja/fruit-ninja.png" alt="Fruit Ninja">
      </a>
    </div>
    <button class="scroll-btn right" onclick="scrollRight(this.parentElement)">&#10095;</button>
  </div>

  <h2>Movies</h2>
  <div class="carousel-container">
    <button class="scroll-btn left" onclick="scrollLeft(this.parentElement)">&#10094;</button>
    <div class="carousel">
      <br>
      <a href="src/movies/Superman/" class="movie-item">
        <img src="src/movies/Superman/superman.webp" alt="Superman">
      </a>
      <a href="src/movies/Hunger Games/" class="movie-item">
        <img src="src/movies/Hunger Games/hunger-games.webp" alt="Hunger Games">
      </a>
    </div>
    <button class="scroll-btn right" onclick="scrollRight(this.parentElement)">&#10095;</button>
  </div>

  <h2>AudioBooks</h2>
  <div class="carousel-container">
    <button class="scroll-btn left" onclick="scrollLeft(this.parentElement)">&#10094;</button>
    <div class="carousel">
      <br>
      <a href="src/audiobooks/OCDaniel/" class="audiobook-item">
        <img src="src/audiobooks/OCDaniel/ocdaniel.webp" alt="OCDaniel">
      </a>
      <a href="src/audiobooks/Hunger Games/" class="audiobook-item">
        <img src="src/audiobooks/Hunger Games/hunger-games.webp" alt="Hunger Games">
      </a>
    </div>
    <button class="scroll-btn right" onclick="scrollRight(this.parentElement)">&#10095;</button>
  </div>

<script>
function scrollLeft(container) {
  const carousel = container.querySelector('.carousel');
  carousel.scrollBy({ left: -carousel.clientWidth * 0.7, behavior: 'smooth' });
}

function scrollRight(container) {
  const carousel = container.querySelector('.carousel');
  carousel.scrollBy({ left: carousel.clientWidth * 0.7, behavior: 'smooth' });
}
</script>

</body>
</html>
