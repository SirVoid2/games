<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Button Test</title>
<style>
  body {
    background: #141414;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
  }

  /* Image as button */
  .img-button {
    width: 200px;
    height: 200px;
    cursor: pointer;
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.3s, filter 0.3s;
  }

  .img-button img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .img-button:hover {
    transform: scale(1.05);
    filter: brightness(0.85);
  }
</style>
</head>
<body>

<!-- Image button -->
<div class="img-button" onclick="window.location.href='Retro Bowl'">
  <img src="Retro Bowl/retro-bowl.jpg" alt="Retro Bowl">
</div>

</body>
</html>
